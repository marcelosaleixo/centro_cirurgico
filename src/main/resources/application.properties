# ============================================================
# CENTRO CIRÚRGICO - CONFIGURAÇÃO COMPLETA
# Java 21 | Spring Boot 3.5.6 | PostgreSQL | Flyway
# Configure DB_PASSWORD e RH_ADMIN_PASSWORD no ambiente antes de iniciar.
# ============================================================
spring.application.name=centrocirurgico

server.port=${SERVER_PORT:8080}
server.servlet.session.timeout=${SESSION_TIMEOUT:15m}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://72.60.59.55:5432/centro_cirurgico}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:@aleixoPr0}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway controla o schema; não use ddl-auto=update em produção.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=America/Campo_Grande

# Thymeleaf e DevTools
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
spring.thymeleaf.encoding=UTF-8
spring.devtools.restart.enabled=${DEVTOOLS_RESTART:false}
spring.devtools.livereload.enabled=${DEVTOOLS_LIVERELOAD:false}

# Cookies e sessão. Em produção HTTPS, defina SESSION_COOKIE_SECURE=true.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=strict

# Administrador inicial. A classe UsuarioSistemaInicializador cria a conta se ausente.
# Não defina senha no Git; configure RH_ADMIN_PASSWORD como variável de ambiente.
app.bootstrap.admin.username=${RH_ADMIN_USERNAME:admin.rh}
app.bootstrap.admin.password=${RH_ADMIN_PASSWORD:}

# Importação de feriados de implantação: arquivo CSV documentado no projeto.
# Não há importação automática pelo properties; use a tela /feriados para cadastrar.

# Logs
logging.level.root=INFO
logging.level.com.marceloaleixo.centrocirurgico=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never


# Health checks para implantação (Etapa 42)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Etapa 49 - Painel de monitoramento dos backups (monte o volume compartilhado /backups)
app.backup.status-file=${BACKUP_STATUS_FILE:/backups/backup-last-status.txt}
app.backup.history-file=${BACKUP_HISTORY_FILE:/backups/backup-operations.csv}
app.backup.max-age-hours=${BACKUP_MAX_AGE_HOURS:36}
