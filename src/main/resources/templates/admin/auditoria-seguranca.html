<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Auditoria de segurança')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main class="container">
  <div class="page-heading">
    <div>
      <p class="eyebrow">ADMINISTRAÇÃO DO SISTEMA</p>
      <h1>Auditoria de segurança</h1>
      <p class="muted">Histórico de autenticação e alterações administrativas. Senhas nunca são registradas.</p>
    </div>
  </div>
  <section class="panel">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Data e hora</th><th>Usuário</th><th>Ação</th><th>Detalhes</th><th>Resultado</th></tr></thead>
        <tbody>
        <tr th:each="r : ${registros}">
          <td th:text="${#temporals.format(r.ocorridoEm, 'dd/MM/yyyy HH:mm:ss')}"></td>
          <td th:text="${r.usuario}"></td>
          <td th:text="${r.acao}"></td>
          <td th:text="${r.detalhes}"></td>
          <td><span class="pill" th:text="${r.sucesso ? 'SUCESSO' : 'FALHA'}"></span></td>
        </tr>
        <tr th:if="${#lists.isEmpty(registros)}"><td colspan="5" class="empty">Nenhum evento de auditoria registrado.</td></tr>
        </tbody>
      </table>
    </div>
    <div class="form-actions" style="margin-top:1rem">
      <a class="button" th:if="${temAnterior}" th:href="@{/admin/auditoria-seguranca(pagina=${paginaAtual - 1})}">Anterior</a>
      <span th:text="'Página ' + (${totalPaginas == 0 ? 0 : paginaAtual + 1}) + ' de ' + ${totalPaginas}"></span>
      <a class="button" th:if="${temProxima}" th:href="@{/admin/auditoria-seguranca(pagina=${paginaAtual + 1})}">Próxima</a>
    </div>
  </section>
</main>
<div th:replace="~{fragments/paginacao :: scripts}"></div>
</body>
</html>
