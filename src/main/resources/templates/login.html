<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Entrar - Centro Cirúrgico</title><style>body{font-family:Arial,sans-serif;background:#f1f5f9;margin:0;min-height:100vh;display:grid;place-items:center}.card{background:white;padding:2rem;border-radius:14px;box-shadow:0 8px 30px #0f172a18;width:min(90vw,360px)}h1{font-size:1.4rem;color:#12345a}label{display:block;margin-top:1rem}input{box-sizing:border-box;width:100%;padding:.8rem;margin-top:.35rem;border:1px solid #cbd5e1;border-radius:8px}button{margin-top:1.2rem;width:100%;padding:.85rem;background:#12345a;color:white;border:0;border-radius:8px;font-weight:bold;cursor:pointer}.msg{color:#b91c1c}.ok{color:#166534}</style></head><body><main class="card"><h1>Centro Cirúrgico</h1><p>Entre com suas credenciais para continuar.</p><p class="msg" th:if="${param.error}">Usuário/senha inválidos ou conta temporariamente bloqueada.</p><p class="ok" th:if="${param.logout}">Sessão encerrada.</p><p class="msg" th:if="${param.expired}">Sua sessão expirou. Entre novamente.</p><p class="msg" th:if="${param.concurrent}">Sua conta foi conectada em outro local e esta sessão foi encerrada.</p><form th:action="@{/login}" method="post"><label for="username">Usuário</label><input id="username" name="username" autocomplete="username" required><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Entrar</button></form></main></body></html>
