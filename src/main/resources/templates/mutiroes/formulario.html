<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Cadastro de mutirão')}"></head><body><aside th:replace="~{fragments/layout :: navbar}"></aside><main class="page-content mutirao-page"><header class="page-header mutirao-header"><div><h1 th:text="${edicao ? 'Editar mutirão' : 'Novo mutirão'}"></h1><p>Cadastre o evento principal. Os dias e as equipes serão configurados na próxima tela.</p></div><a class="btn btn-secondary" th:href="@{/mutiroes}">Voltar</a></header><div th:replace="~{fragments/layout :: mensagens}"></div><section class="card"><form th:action="@{/mutiroes/salvar}" th:object="${evento}" method="post" class="form-grid two-columns"><input type="hidden" th:field="*{id}"><label>Nome do mutirão *<input th:field="*{nome}" required maxlength="160" placeholder="Ex.: Mutirão de cirurgia vascular"></label><label>Especialidade *<input th:field="*{especialidade}" required maxlength="100" placeholder="Ex.: Vascular, bariátrica, otorrino"></label><label>Data inicial *<input type="date" id="dataInicio" name="dataInicio" th:value="${evento.dataInicio != null ? #temporals.format(evento.dataInicio, 'yyyy-MM-dd') : ''}" required></label><label>Data final *<input type="date" id="dataFim" name="dataFim" th:value="${evento.dataFim != null ? #temporals.format(evento.dataFim, 'yyyy-MM-dd') : ''}" required></label><label>Responsável<input th:field="*{responsavel}" maxlength="160"></label><label>Status<select th:field="*{status}"><option value="PLANEJADO">Planejado</option><option value="EM_PREPARACAO">Em preparação</option><option value="EM_ANDAMENTO">Em andamento</option><option value="CONCLUIDO">Concluído</option><option value="CANCELADO">Cancelado</option></select></label><label class="full-width">Observações<textarea th:field="*{observacoes}" rows="4"></textarea></label><div class="form-actions full-width"><button class="btn btn-primary" type="submit">Salvar e configurar dias</button><a class="btn btn-secondary" th:href="@{/mutiroes}">Cancelar</a></div></form></section></main></body></html>
