<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Mutirões cirúrgicos')}"></head><body><aside th:replace="~{fragments/layout :: navbar}"></aside><main class="page-content mutirao-page"><header class="page-header mutirao-header"><div><h1>Mutirões cirúrgicos</h1><p>Eventos, períodos e programação diária do centro cirúrgico.</p></div><a class="btn btn-primary" th:href="@{/mutiroes/novo}">+ Novo mutirão</a></header><div th:replace="~{fragments/layout :: mensagens}"></div><section class="card"><div class="table-responsive"><table><thead><tr><th>Evento</th><th>Especialidade</th><th>Período</th><th>Status</th><th>Dias programados</th><th>Ações</th></tr></thead><tbody><tr th:each="e : ${eventos}"><td th:text="${e.nome}"></td><td th:text="${e.especialidade}"></td><td><span th:text="${#temporals.format(e.dataInicio,'dd/MM/yyyy')}"></span> a <span th:text="${#temporals.format(e.dataFim,'dd/MM/yyyy')}"></span></td><td th:text="${e.status}"></td><td th:text="${#lists.size(e.dias)}"></td><td class="actions"><a class="btn btn-secondary btn-sm" th:href="@{/mutiroes/{id}/dias(id=${e.id})}">Programação e equipes</a><a class="btn btn-secondary btn-sm" th:href="@{/mutiroes/{id}/editar(id=${e.id})}">Editar</a></td></tr><tr th:if="${#lists.isEmpty(eventos)}"><td colspan="6">Nenhum mutirão cadastrado.</td></tr></tbody></table></div></section></main></body></html>
