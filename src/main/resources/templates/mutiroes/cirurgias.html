<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cirurgias do mutirão</title><link rel="stylesheet" th:href="@{/css/style.css}"><style>.wrap{max-width:1200px;margin:24px auto;padding:16px}.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.btn{display:inline-block;padding:10px 14px;border-radius:8px;background:#075985;color:white;text-decoration:none;border:0;cursor:pointer}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{padding:11px;border-bottom:1px solid #ddd;text-align:left;white-space:nowrap}.alert{padding:10px;background:#e0f2fe;margin:12px 0}.muted{color:#64748b}</style></head><body><main class="wrap"><div class="bar"><div><h1>Programação cirúrgica</h1><p class="muted" th:text="|${dia.evento.nome} — ${#temporals.format(dia.data,'dd/MM/yyyy')}|">Mutirão</p></div><a class="btn" th:href="@{/mutiroes/dias/{id}/cirurgias/nova(id=${dia.id})}">+ Lançar cirurgia</a></div><div class="alert" th:if="${sucesso}" th:text="${sucesso}"></div><div class="alert" th:if="${erro}" th:text="${erro}"></div><div class="table-wrap"><table><thead><tr><th>Horário</th><th>Paciente</th><th>Procedimento</th><th>Médico responsável</th><th>Status</th><th>Ações</th></tr></thead><tbody><tr th:each="c : ${cirurgias}"><td th:text="|${c.horaInicio}–${c.horaFim}|"></td><td th:text="${c.paciente.nome}"></td><td th:text="${c.procedimento.nome}"></td><td th:text="${c.medicoResponsavel}"></td><td th:text="${c.status}"></td><td><a th:href="@{/mutiroes/dias/cirurgias/{id}/editar(id=${c.id})}">Editar</a> <form style="display:inline" method="post" th:action="@{/mutiroes/dias/cirurgias/{id}/excluir(id=${c.id})}" onsubmit="return confirm('Remover esta cirurgia da programação?')"><button type="submit">Excluir</button></form></td></tr><tr th:if="${#lists.isEmpty(cirurgias)}"><td colspan="6">Nenhuma cirurgia lançada para este dia.</td></tr></tbody></table></div><p><a th:href="@{/mutiroes}">Voltar aos mutirões</a></p></main></body></html>
