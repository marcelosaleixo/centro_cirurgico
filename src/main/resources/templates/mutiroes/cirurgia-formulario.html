<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cadastro de cirurgia do mutirão</title><style>body{font-family:Arial,sans-serif;color:#0f172a}.wrap{max-width:850px;margin:24px auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}label{display:block;font-weight:600;margin-bottom:6px}input,select,textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px}textarea{min-height:90px}.btn{padding:11px 16px;background:#075985;color:white;border:0;border-radius:8px;cursor:pointer;margin-top:16px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1 th:text="${cirurgia.id == null ? 'Lançar cirurgia' : 'Editar cirurgia'}">Lançar cirurgia</h1><p th:text="|${dia.evento.nome} — ${#temporals.format(dia.data,'dd/MM/yyyy')}|"></p><div th:if="${erro}" th:text="${erro}" style="padding:10px;background:#fee2e2"></div><form method="post" th:action="@{/mutiroes/dias/{id}/cirurgias/salvar(id=${dia.id})}"><input type="hidden" name="id" th:value="${cirurgia.id}"><div class="grid"><div><label>Paciente</label><select name="pacienteId" required><option value="">Selecione</option><option th:each="p:${pacientes}" th:value="${p.id}" th:selected="${cirurgia.paciente != null and cirurgia.paciente.id == p.id}" th:text="${p.nome}"></option></select></div><div><label>Procedimento</label><select name="procedimentoId" required><option value="">Selecione</option><option th:each="p:${procedimentos}" th:value="${p.id}" th:selected="${cirurgia.procedimento != null and cirurgia.procedimento.id == p.id}" th:text="${p.nome}"></option></select></div><div><label>Médico responsável</label><input name="medicoResponsavel" required maxlength="160" th:value="${cirurgia.medicoResponsavel}"></div><div><label>Status</label><select name="status"><option value="PROGRAMADA" th:selected="${cirurgia.status == 'PROGRAMADA'}">Programada</option><option value="CONFIRMADA" th:selected="${cirurgia.status == 'CONFIRMADA'}">Confirmada</option><option value="REALIZADA" th:selected="${cirurgia.status == 'REALIZADA'}">Realizada</option><option value="CANCELADA" th:selected="${cirurgia.status == 'CANCELADA'}">Cancelada</option></select></div><div><label>Horário de início</label><input type="time" name="horaInicio" required th:value="${cirurgia.horaInicio}"></div><div><label>Horário de término</label><input type="time" name="horaFim" required th:value="${cirurgia.horaFim}"></div><div style="grid-column:1/-1"><label>Observações</label><textarea name="observacoes" th:text="${cirurgia.observacoes}"></textarea></div></div><button class="btn" type="submit">Salvar cirurgia</button> <a th:href="@{/mutiroes/dias/{id}/cirurgias(id=${dia.id})}">Cancelar</a></form></main></body></html>
