<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Nova solicitação de compra')}"></head><body><header th:replace="~{fragments/layout :: navbar}"></header><main class="container"><div th:replace="~{fragments/layout :: mensagens}"></div><div class="page-heading"><div><p class="eyebrow">SUPRIMENTOS</p><h1>Nova solicitação de compra</h1><p class="muted">A solicitação seguirá para aprovação e não altera o saldo do estoque.</p></div><a class="button" th:href="@{/compras/solicitacoes}">Voltar</a></div><section class="panel"><form th:action="@{/compras/solicitacoes}" method="post" class="form-grid"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><label>Item do estoque<select name="itemId" required><option value="">Selecione um item</option><option th:each="i : ${itens}" th:value="${i.id}" th:text="${i.codigo + ' — ' + i.nome + ' (' + i.unidadeMedida + ')'}"></option></select></label><label>Quantidade solicitada<input type="number" name="quantidadeSolicitada" min="0.001" step="0.001" required/></label><label>Responsável pela solicitação<input name="responsavelSolicitacao" maxlength="160" required/></label><label>Fornecedor sugerido<input name="fornecedorSugerido" maxlength="180"/></label><label class="full-width">Justificativa<textarea name="justificativa" rows="3" maxlength="1000" required placeholder="Informe a necessidade de reposição"></textarea></label><label class="full-width">Observações<textarea name="observacao" rows="2" maxlength="1000"></textarea></label><div class="actions full-width"><button type="submit" class="button primary">Registrar solicitação</button><a class="button" th:href="@{/compras/solicitacoes}">Cancelar</a></div></form></section></main></body></html>
