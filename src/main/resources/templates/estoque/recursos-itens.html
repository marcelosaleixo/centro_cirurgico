<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Insumos do recurso')}"></head><body><header th:replace="~{fragments/layout :: navbar}"></header><main class="container"><div th:replace="~{fragments/layout :: mensagens}"></div>
<div class="page-heading"><div><p class="eyebrow">SUPRIMENTOS</p><h1>Insumos do recurso</h1><p class="muted" th:text="${recurso.nome + ' — configure os níveis mínimos para identificar reposição.'}"></p></div><a class="button" th:href="@{/estoque/recursos}">Voltar</a></div>
<section class="panel"><h2>Adicionar insumo ou ajustar mínimo</h2><form class="form-grid" th:object="${form}" method="post" th:action="${tipoRecurso == 'carrinho'} ? @{/estoque/recursos/carrinhos/{id}/itens/minimo(id=${recurso.id})} : @{/estoque/recursos/armarios/{id}/itens/minimo(id=${recurso.id})}">
<label>Insumo <span class="required">*</span><select th:field="*{itemId}" required><option value="">Selecione...</option><option th:each="i : ${itensDisponiveis}" th:value="${i.id}" th:text="${i.codigo + ' — ' + i.nome + ' (' + i.unidadeMedida + ')'}"></option></select></label><label>Quantidade mínima <span class="required">*</span><input type="number" th:field="*{quantidadeMinima}" min="0" step="0.001" required></label><div class="form-actions"><button class="button primary">Salvar mínimo</button></div></form></section>
<section class="panel"><h2>Saldo e reposição</h2><div class="table-wrap"><table><thead><tr><th>Insumo</th><th>Saldo atual</th><th>Quantidade mínima</th><th>Situação</th></tr></thead><tbody>
<tr th:each="ri : ${itensRecurso}"><td th:text="${ri.item.codigo + ' — ' + ri.item.nome}"></td><td th:text="${ri.quantidadeAtual}"></td><td th:text="${ri.quantidadeMinima}"></td><td><span class="pill" th:text="${ri.quantidadeAtual.compareTo(ri.quantidadeMinima) <= 0 ? 'Reposição necessária' : 'Disponível'}"></span></td></tr>
<tr th:if="${#lists.isEmpty(itensRecurso)}"><td colspan="4" class="empty">Nenhum insumo configurado neste recurso.</td></tr></tbody></table></div><p class="hint">Para abastecer, acesse Estoque → Nova movimentação e transfira do estoque geral para o carrinho ou armário.</p></section>
</main><div th:replace="~{fragments/paginacao :: scripts}"></div>
</body></html>
